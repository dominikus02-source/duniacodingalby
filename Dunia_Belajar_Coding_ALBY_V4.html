<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dunia Belajar Coding ALBY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#33283D;--ink2:#6B5E75;--paper:#FBF3E4;--card:#FFFDF6;--coral:#FF7A45;--sun:#FFC531;--leaf:#3DAE5B;--teal:#12B5A5;--sky:#3E8DDD;--rose:#E85D75;--violet:#7C5CE0;--night:#3B3B6D;--sand:#F3E4C8;--line:rgba(51,40,61,.14);--sh:0 5px 0 var(--ink);--sh2:0 4px 0 var(--ink)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',sans-serif;color:var(--ink);background:var(--paper);background-image:radial-gradient(rgba(51,40,61,.055) 1.6px,transparent 1.6px);background-size:26px 26px;min-height:100vh;font-size:16px;line-height:1.5}
h1,h2,h3,h4{font-family:'Baloo 2',cursive;line-height:1.15}
button{font-family:inherit;cursor:pointer;color:inherit}
input,textarea,select{font-family:inherit;color:var(--ink)}
img,svg{display:block}
#app{max-width:1100px;margin:0 auto;padding:18px 16px 130px}
.ic{width:1.25em;height:1.25em;flex:none}
.hide{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-family:'Baloo 2';font-weight:700;font-size:17px;border:3px solid var(--ink);border-radius:16px;background:#fff;box-shadow:var(--sh);padding:11px 20px;min-height:52px;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-coral{background:var(--coral);color:#fff}.btn-sun{background:var(--sun)}.btn-leaf{background:var(--leaf);color:#fff}.btn-teal{background:var(--teal);color:#fff}
.btn-sm{min-height:42px;padding:7px 14px;font-size:15px;border-radius:13px;box-shadow:var(--sh2)}
.btn-icon{width:48px;height:48px;padding:0;border-radius:14px}
.card{background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;border:2.5px solid var(--ink);border-radius:999px;padding:5px 13px;font-weight:800;font-size:13.5px;background:#fff;box-shadow:0 3px 0 var(--ink)}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-weight:800;font-size:12.5px;border:2.5px solid var(--ink);background:var(--sun)}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.avatar-wrap{position:relative;width:64px;height:64px;flex:none}
.avatar-badge{position:absolute;right:-6px;bottom:-4px;background:var(--sun);border:2.5px solid var(--ink);border-radius:999px;width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.avatar-badge .ic{width:14px;height:14px}
.hello h1{font-size:clamp(24px,4vw,34px)}
.hello p{color:var(--ink2);font-weight:700;font-size:14px}
.xp-wrap{margin-left:auto;display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:7px 16px 7px 8px;box-shadow:var(--sh2)}
.xp-bar{width:min(150px,32vw);height:14px;border:2.5px solid var(--ink);border-radius:999px;background:#EFE4CE;overflow:hidden}
.xp-fill{height:100%;background:var(--leaf);border-radius:999px;transition:width .6s cubic-bezier(.34,1.56,.64,1)}
.xp-num{font-family:'Baloo 2';font-weight:800;font-size:15px;white-space:nowrap}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;justify-content:center;padding:0 10px;pointer-events:none}
.nav-inner{pointer-events:auto;display:flex;align-items:flex-end;gap:6px;background:#fff;border:3px solid var(--ink);border-radius:22px 22px 0 0;border-bottom:none;padding:8px 12px 10px}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;font-family:'Baloo 2';font-weight:700;font-size:12px;color:var(--ink2);padding:4px 12px;border-radius:12px;min-width:64px}
.nav-btn .ic{width:24px;height:24px}
.nav-btn.on{color:var(--ink);background:var(--sun);border:2.5px solid var(--ink)}
.nav-fab{width:72px;height:72px;margin:-26px 8px 0;border-radius:999px;background:var(--coral);color:#fff;border:3.5px solid var(--ink);box-shadow:0 6px 0 var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:'Baloo 2';font-weight:800;font-size:11.5px}
.nav-fab:active{transform:translateY(4px)}
.nav-fab .ic{width:26px;height:26px}
.hero-card{display:flex;gap:18px;align-items:center;padding:22px;position:relative;overflow:hidden;cursor:pointer}
.hero-band{position:absolute;inset:0;opacity:.16}
.hero-ico{width:84px;height:84px;border-radius:24px;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;flex:none;background:#fff;box-shadow:var(--sh2);position:relative}
.hero-ico .ic{width:44px;height:44px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.sec-title{display:flex;align-items:center;gap:10px;font-size:20px;margin:26px 0 12px}
.sec-title .ic{color:var(--coral)}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px}
.badge-card{flex:none;width:112px;text-align:center;padding:14px 8px;border:3px solid var(--ink);border-radius:18px;background:#fff;box-shadow:var(--sh2)}
.badge-card.locked{opacity:.4;filter:grayscale(1)}
.badge-ico{width:52px;height:52px;margin:0 auto 6px;border-radius:999px;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center}
.badge-card h4{font-size:13px}.badge-card small{font-size:10.5px;color:var(--ink2);font-weight:700}
.kiko-bubble-home{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;margin-top:22px}
.kiko-mini{width:58px;flex:none;animation:float 3.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.map-wrap{position:relative;padding:10px 0 30px}
.map-line{position:absolute;inset:0;pointer-events:none;z-index:0}
.world-node{position:relative;z-index:1;display:flex;gap:16px;align-items:center;margin:0 0 34px;width:min(520px,100%);cursor:pointer;border:3px solid var(--ink);border-radius:24px;background:#fff;box-shadow:0 6px 0 var(--ink);padding:14px 18px;transition:transform .12s}
.world-node:hover{transform:translateY(-3px)}
.world-orb{width:78px;height:78px;border-radius:999px;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:inset 0 -6px 0 rgba(0,0,0,.14)}
.world-orb .ic{width:38px;height:38px;color:#fff}
.world-node h3{font-size:19px}
.world-node p{font-size:13.5px;color:var(--ink2);font-weight:700}
.world-locked{opacity:.55}
.lock-ribbon{position:absolute;top:-12px;right:14px;background:var(--ink);color:#fff;font-family:'Baloo 2';font-weight:700;font-size:12px;padding:4px 12px;border-radius:999px;display:flex;gap:5px;align-items:center}
.prog-mini{height:10px;border:2.5px solid var(--ink);border-radius:999px;background:#EFE4CE;overflow:hidden;width:130px;margin-top:5px}
.prog-mini i{display:block;height:100%;background:var(--leaf)}
.world-head{display:flex;align-items:center;gap:18px;padding:20px;border-radius:24px;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);color:#fff;margin-bottom:22px}
.world-head .ic{width:52px;height:52px}
.mission-row{display:flex;gap:14px;align-items:center;padding:14px 16px;border:3px solid var(--ink);border-radius:20px;background:#fff;box-shadow:var(--sh2);margin-bottom:14px;cursor:pointer;transition:transform .1s}
.mission-row:hover{transform:translateX(4px)}
.mission-row.locked{opacity:.5;cursor:not-allowed}
.mission-row.done{background:#EFFBF1}
.mnode{width:52px;height:52px;border-radius:999px;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:'Baloo 2';font-weight:800;font-size:19px;flex:none;background:var(--sand)}
.mission-row.done .mnode{background:var(--leaf);color:#fff}
.mission-row.boss .mnode{background:var(--sun)}
.mstars{display:flex;gap:2px}
.mstars .ic{width:17px;height:17px;color:#D9CBAE}
.mstars .ic.f{color:var(--sun)}
.brief-grid{display:grid;grid-template-columns:1.25fr .9fr;gap:18px;margin-top:18px}
@media(max-width:860px){.brief-grid{grid-template-columns:1fr}}
.story-card{padding:20px}
.story-card p{font-size:15.5px;font-weight:600}
.kiko-panel{padding:16px;display:flex;flex-direction:column;gap:12px}
.bubble{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:12px 15px;font-weight:700;font-size:14.5px}
.bubble.tip{background:#FFF6D6}
.play-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
@media(max-width:980px){.play-grid{grid-template-columns:1fr}}
.stage{padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.stage-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stage-head h3{font-size:18px;margin-right:auto}
.board-holder{background:var(--sand);border:3px solid var(--ink);border-radius:18px;padding:10px;overflow:auto;display:flex;justify-content:center;position:relative}
.runbar{display:flex;gap:10px;flex-wrap:wrap}
.blk{display:inline-flex;align-items:center;gap:8px;font-family:'Baloo 2';font-weight:700;font-size:15.5px;border:3px solid var(--ink);border-radius:14px;padding:9px 14px;box-shadow:var(--sh2);min-height:48px}
button.blk:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.blk .x{width:22px;height:22px;border-radius:8px;border:2px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center;margin-left:2px}
.blk .x .ic{width:12px;height:12px}
.program-box{border:3px solid var(--ink);border-radius:18px;padding:12px;background:#F8F1E2;min-height:74px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.emptymsg,.looptip{font-weight:800;color:var(--ink2);font-size:13.5px;font-style:italic}
.loopbox{border:3px dashed var(--violet);border-radius:16px;padding:8px 10px;background:#F3EDFC}
.loopbox.active{background:#FFF3C2;border-style:solid}
.loop-head{display:flex;align-items:center;gap:8px;font-family:'Baloo 2';font-weight:700;font-size:14.5px;margin-bottom:6px}
.loop-head .stepper{display:flex;align-items:center;gap:4px;border:2.5px solid var(--ink);border-radius:10px;background:#fff;padding:1px 4px}
.loop-head .stepper button{border:none;background:none;font-family:'Baloo 2';font-weight:800;font-size:16px;width:22px}
.loop-kids{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;border-radius:12px;padding:4px}
.loop-kids.empty{background:repeating-linear-gradient(45deg,#EDE3FA 0 8px,transparent 8px 16px)}
.palette{display:flex;gap:10px;flex-wrap:wrap}
.mentor-fail{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.hint-steps{display:flex;flex-direction:column;gap:8px}
.hint-step{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:10px 13px;font-weight:700;font-size:14px;animation:popin .3s}
@keyframes popin{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.seg{display:inline-flex;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:#fff;box-shadow:var(--sh2);flex-wrap:wrap}
.seg button{border:none;background:none;font-family:'Baloo 2';font-weight:700;font-size:14px;padding:9px 14px;min-height:44px;border-right:2.5px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--sun)}
.rule-card{border:3px solid var(--ink);border-radius:18px;background:#fff;padding:14px 16px;box-shadow:var(--sh2)}
.rule-card h4{font-size:15.5px;margin-bottom:9px;display:flex;gap:8px;align-items:center}
.rule-card h4 .ic{color:var(--teal)}
.gm-canvas-wrap{position:relative;border:3px solid var(--ink);border-radius:18px;overflow:hidden}
.gm-hud{position:absolute;top:10px;left:12px;right:12px;display:flex;gap:10px;color:#fff;font-family:'Baloo 2';font-weight:800;font-size:17px;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.gm-over{position:absolute;inset:0;background:rgba(51,40,61,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;text-align:center;padding:20px}
.field{display:block;margin-bottom:12px}
.field label{display:block;font-weight:800;font-size:13.5px;margin-bottom:5px}
.field input[type=text],.field input:not([type]){width:100%;border:3px solid var(--ink);border-radius:14px;padding:10px 13px;font-size:15px;font-weight:700;background:#fff}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:44px;height:44px;border-radius:12px;border:3px solid var(--ink);box-shadow:var(--sh2)}
.swatch.on{outline:4px solid var(--sun)}
.sticker-pick{display:flex;gap:8px;flex-wrap:wrap}
.sticker-pick .swatch{display:flex;align-items:center;justify-content:center;background:#fff}
.sticker-pick .swatch .ic{width:26px;height:26px}
.story-view{border:3px solid var(--ink);border-radius:20px;overflow:hidden;box-shadow:var(--sh2);position:relative;min-height:250px;display:flex;flex-direction:column;justify-content:flex-end}
.story-view .scene{position:absolute;inset:0;width:100%;height:100%}
.story-view .dialog{position:relative;margin:14px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:12px 15px;font-weight:800;font-size:16px}
.story-choices{position:relative;display:flex;gap:10px;margin:0 14px 14px;flex-wrap:wrap}
.kartu{border:3px solid var(--ink);border-radius:22px;padding:26px 20px;text-align:center;box-shadow:0 7px 0 var(--ink);min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.kartu .pesan{font-size:19px;font-weight:800;font-family:'Baloo 2';line-height:1.35}
.kartu .untuk{font-weight:800;font-size:14px;opacity:.75}
.web-frame{width:100%;height:330px;border:3px solid var(--ink);border-radius:16px;background:#fff}
.code-view{background:var(--night);color:#EAF2FF;border:3px solid var(--ink);border-radius:16px;padding:16px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.7;overflow:auto;white-space:pre;text-align:left}
.slotline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;font-size:15.5px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px 14px;margin-bottom:9px;box-shadow:var(--sh2)}
.slotline .kw{color:var(--violet)}
.slotline select{border:2.5px solid var(--ink);border-radius:10px;padding:5px 8px;font-weight:800;font-size:14.5px;background:var(--sun);min-height:40px}
.varbox{display:inline-flex;flex-direction:column;align-items:center;border:3px solid var(--ink);border-radius:16px;background:var(--sun);padding:10px 22px;box-shadow:var(--sh2)}
.varbox b{font-family:'Baloo 2';font-size:34px;line-height:1}
.varbox small{font-weight:800;font-size:12px}
.creation-card{border:3px solid var(--ink);border-radius:20px;background:#fff;box-shadow:var(--sh2);overflow:hidden}
.creation-top{height:110px;display:flex;align-items:center;justify-content:center;border-bottom:3px solid var(--ink)}
.creation-top .ic{width:46px;height:46px;color:#fff}
.creation-body{padding:13px 15px}
.creation-body h4{font-size:16px}
.creation-body small{color:var(--ink2);font-weight:700}
.creation-acts{display:flex;gap:8px;margin-top:10px}
.studio-card{cursor:pointer;border:3px solid var(--ink);border-radius:22px;background:#fff;box-shadow:0 6px 0 var(--ink);padding:20px;transition:transform .12s}
.studio-card:hover{transform:translateY(-4px)}
.studio-ico{width:64px;height:64px;border-radius:18px;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;margin-bottom:12px;box-shadow:var(--sh2)}
.studio-ico .ic{width:32px;height:32px;color:#fff}
.parent-tab{display:inline-flex;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:#fff;box-shadow:var(--sh2);margin-bottom:18px;flex-wrap:wrap}
.parent-tab button{border:none;background:none;font-family:'Baloo 2';font-weight:700;padding:10px 16px;min-height:46px;border-right:2.5px solid var(--line);font-size:14.5px}
.parent-tab button.on{background:var(--sun)}
.mastery-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.mastery-row span{width:170px;font-weight:800;font-size:13.5px;flex:none}
.mastery-bar{flex:1;height:15px;border:2.5px solid var(--ink);border-radius:999px;background:#EFE4CE;overflow:hidden}
.mastery-bar i{display:block;height:100%;background:var(--teal)}
.daybar{display:flex;align-items:flex-end;gap:6px;height:70px}
.daybar div{flex:1;background:var(--sky);border:2.5px solid var(--ink);border-radius:6px 6px 0 0;min-height:4px;position:relative}
.daybar span{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:10px;font-weight:800;color:var(--ink2)}
.curr-list{columns:2;column-gap:26px}
@media(max-width:700px){.curr-list{columns:1}}
.curr-list li{break-inside:avoid;margin-bottom:6px;font-size:13.5px;font-weight:600;list-style:none;padding-left:20px;position:relative}
.curr-list li::before{content:"";position:absolute;left:0;top:7px;width:9px;height:9px;border-radius:3px;background:var(--coral);border:2px solid var(--ink)}
.overlay{position:fixed;inset:0;background:rgba(51,40,61,.66);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;animation:fadein .25s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.ov-card{background:var(--card);border:3.5px solid var(--ink);border-radius:26px;box-shadow:0 9px 0 var(--ink);max-width:480px;width:100%;padding:26px 22px;text-align:center;animation:popin .35s cubic-bezier(.34,1.56,.64,1);max-height:92vh;overflow:auto}
.big-stars{display:flex;justify-content:center;gap:8px;margin:12px 0}
.big-stars .ic{width:46px;height:46px;color:#DCD0B4}
.big-stars .ic.f{color:var(--sun);filter:drop-shadow(0 3px 0 var(--ink));animation:starpop .5s cubic-bezier(.34,1.7,.64,1) both}
.big-stars .ic.f:nth-child(2){animation-delay:.15s}
.big-stars .ic.f:nth-child(3){animation-delay:.3s}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1)}}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-family:'Baloo 2';font-weight:700;padding:11px 20px;border-radius:14px;z-index:120;opacity:0;transition:all .3s;pointer-events:none;border:3px solid #fff;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:150}
.conf-bit{position:absolute;will-change:transform}
.splash{min-height:92vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:20px}
.splash h1{font-size:clamp(38px,7vw,62px)}
.splash h1 em{font-style:normal;color:var(--coral);text-shadow:3px 3px 0 var(--ink)}
.splash .sub{font-weight:800;color:var(--ink2);max-width:430px}
.wiggle{animation:wig 2.6s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.pre-reader .story-card,.pre-reader .bubble,.pre-reader .mission-row p{font-size:20px!important;line-height:1.65}
.pre-reader .btn{min-height:62px;font-size:20px!important}
.pre-reader .world-node{min-height:92px}
.pre-reader .hint-step{font-size:19px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.robot-wrap{transition:transform .34s ease}
.robot-rot{transition:transform .3s ease}
#errbox{position:fixed;top:0;left:0;right:0;z-index:999;background:#C0392B;color:#fff;padding:12px 16px;font-weight:800;font-size:14px;display:none}

/* ====== PEMBESARAN TULISAN UNTUK ALBY ====== */
body{font-size:17.5px;line-height:1.6}
.btn{font-size:18.5px!important;min-height:56px}
.btn-sm{font-size:16.5px!important;min-height:48px}
.blk{font-size:17px;min-height:52px}
.chip{font-size:14.5px!important}
.tag{font-size:14px}
.bubble{font-size:17px}
.hint-step{font-size:16.5px}

<script>
"use strict";
/* ============ PENJAG ERROR ============ */
function showFatal(msg){
  var b=document.getElementById('errbox');
  if(b){ b.style.display='block'; b.textContent='Ups, ada gangguan teknis: '+msg+' — kirimkan teks ini ke pengembang.'; }
}
window.addEventListener('error', function(e){ showFatal(e.message); });
window.addEventListener('unhandledrejection', function(e){
  var r=e.reason; showFatal(r&&r.message?r.message:String(r));
});

/* ============ UTIL ============ */
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){ try{ return new Date(iso).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}); }catch(e){ return iso; } }
function ic(n,st){ return '<svg class="ic" style="'+(st||'')+'"><use href="#i-'+n+'"/></svg>'; }
function uid(){ return Math.random().toString(36).slice(2,9); }

/* ============ AUDIO ============ */
var AC=null, muted=false;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(f,dur,type,vol,when){
  var c=ac(); if(!c||muted) return;
  dur=dur||.18; type=type||'sine'; vol=vol||.16; when=when||0;
  try{
    var o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(.0001, c.currentTime+when);
    g.gain.exponentialRampToValueAtTime(vol, c.currentTime+when+.02);
    g.gain.exponentialRampToValueAtTime(.0001, c.currentTime+when+dur);
    o.connect(g); g.connect(c.destination);
    o.start(c.currentTime+when); o.stop(c.currentTime+when+dur+.05);
  }catch(e){}
}
var NOTES={do:262,re:294,mi:330,sol:392,la:440};
var sfx={
  click:function(){ tone(620,.07,'square',.08); },
  pop:function(){ tone(880,.09,'sine',.14); tone(1320,.08,'sine',.08,.05); },
  good:function(){ tone(523,.12); tone(659,.12,'sine',.16,.1); },
  fail:function(){ tone(300,.2,'triangle',.14); tone(220,.28,'triangle',.14,.14); },
  win:function(){ [523,659,784,1047].forEach(function(f,i){ tone(f,.22,'triangle',.18,i*.13); }); },
  levelup:function(){ [392,523,659,784,1047].forEach(function(f,i){ tone(f,.2,'square',.1,i*.11); }); }
};
document.addEventListener('pointerdown', function(){ ac(); }, {once:true});

/* ============ KARAKTER ============ */

  +'<rect x="6.5" y="25.5" width="4.6" height="3.6" rx="1.8" fill="#33283D"/>'

  +'<rect x="9" y="20.5" width="8" height="5" rx="2" fill="#12B5A5" stroke="#33283D" stroke-width="1.5"/></svg>';
}

/* ============ STATE ============ */
var KEY='alby_dunia_v3';
var DEFAULT={name:'Alby',xp:0,missions:{},mastery:{},masteryEvidence:{},badges:[],creations:[],days:{},sound:true,seen:false,retries:0,placement:{done:false,score:0,startWorld:1,reader:true},activity:{last:0,lastTick:0,activeMinutes:0}};
var S=loadState();
function loadState(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){ var o=JSON.parse(raw); for(var k in DEFAULT){ if(o[k]===undefined) o[k]=DEFAULT[k]; } return o; }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT));
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* Aktivitas nyata: waktu hanya dihitung ketika ALBY benar-benar berinteraksi. */
function markActivity(){
  var now=Date.now();
  if(!S.activity) S.activity={last:0,lastTick:0,activeMinutes:0};
  S.activity.last=now;
  if(!S.activity.lastTick) S.activity.lastTick=now;
}
document.addEventListener('pointerdown',markActivity,{passive:true});
document.addEventListener('keydown',markActivity,{passive:true});
document.addEventListener('input',markActivity,{passive:true});
document.addEventListener('change',markActivity,{passive:true});
setInterval(function(){
  if(document.visibilityState!=='visible') return;
  var now=Date.now();
  if(!S.activity) S.activity={last:now,lastTick:now,activeMinutes:0};
  var tick=S.activity.lastTick||now;
  var elapsed=Math.max(0,now-tick);
  S.activity.lastTick=now;
  if(S.activity.last && now-S.activity.last<=90000){
    var mins=elapsed/60000;
    S.activity.activeMinutes=(S.activity.activeMinutes||0)+mins;
    var d=todayStr();
    S.days[d]=(S.days[d]||0)+mins;
    save();
  }
},60000);
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='hidden') save(); });
window.addEventListener('beforeunload',save);
markActivity();

/* ============ LEVEL / XP / MASTERY / LENCANA ============ */
var LEVELS=[
  {name:'Pemula',min:0,icon:'egg'},
  {name:'Penjelajah',min:150,icon:'map'},
  {name:'Pemecah Masalah',min:400,icon:'bolt'},
  {name:'Pembuat',min:750,icon:'tool'},
  {name:'Pencipta',min:1200,icon:'rocket'},
  {name:'Ahli Coding',min:1800,icon:'bulb'}
];
function levelIdx(){ var i=0; LEVELS.forEach(function(l,k){ if(S.xp>=l.min) i=k; }); return i; }
function addXP(n,silent){
  var before=levelIdx();
  S.xp+=n; save();
  if(!silent) toast('+'+n+' XP');
  var after=levelIdx();
  if(after>before){
    sfx.levelup();
    showOverlay(robotSVG(96)
      +'<h2 style="font-size:26px;margin:8px 0 2px">Naik Level!</h2>'
      +'<div class="tag" style="margin:6px 0 14px">'+ic(LEVELS[after].icon)+' '+LEVELS[after].name+'</div>'
      +'<p style="font-weight:700;color:var(--ink2)">Kemampuan codingmu makin kuat, '+esc(S.name)+'!</p>'
      +'<button class="btn btn-coral" style="margin-top:16px" onclick="A.closeOverlay()">'+ic('check')+' Siap!</button>');
  } else updateTopbarXP();
}
var CONCEPTS={seq:'Urutan',dir:'Arah & orientasi',pattern:'Pola',cause:'Sebab & akibat',algo:'Algoritma',loop:'Perulangan (loop)',event:'Kejadian (event)',sound:'Suara & nada',debug:'Debugging',cond:'Kondisi (jika…maka)',game:'Logika game',story:'Bercerita',vars:'Variabel',app:'Aplikasi',ui:'Antarmuka',html:'HTML',js:'JavaScript',create:'Berkarya'};
function addMastery(list,amt,evidence){
  evidence=evidence||{};
  list.forEach(function(c){
    var before=Number(S.mastery[c]||0);
    S.mastery[c]=Math.min(100,before+amt);
    if(!S.masteryEvidence[c]) S.masteryEvidence[c]={successes:0,failures:0,hints:0,variations:0,lastAt:null};
    S.masteryEvidence[c].successes+=(evidence.successes||0);
    S.masteryEvidence[c].failures+=(evidence.failures||0);
    S.masteryEvidence[c].hints+=(evidence.hints||0);
    S.masteryEvidence[c].variations+=(evidence.variations||0);
    S.masteryEvidence[c].lastAt=new Date().toISOString();
  });
  save();
}
function masteryLabel(v){
  v=Number(v||0);
  if(v<20) return 'Belum kenal';
  if(v<40) return 'Mulai memahami';
  if(v<60) return 'Sedang berkembang';
  if(v<80) return 'Cukup menguasai';
  if(v<95) return 'Menguasai';
  return 'Mandiri';
}

function checkBadges(){

  BADGES.forEach(function(b){
    if(S.badges.indexOf(b.id)<0 && b.cond()){ S.badges.push(b.id); fresh.push(b); }
  });
  if(fresh.length) save();
  return fresh;
}

/* ============ KEMAJUAN ============ */
function mrec(id){ if(!S.missions[id]) S.missions[id]={done:false,stars:0,tries:0,hints:0}; return S.missions[id]; }
function isDone(id){ return !!(S.missions[id]&&S.missions[id].done); }
function doneCount(){ return Object.keys(S.missions).filter(function(k){ return S.missions[k].done; }).length; }
function totalStars(){ var t=0; Object.keys(S.missions).forEach(function(k){ t+=S.missions[k].stars||0; }); return t; }
function worldUnlocked(w){
  if(w.id===1||w.id===8) return true;
  if(S.placement&&S.placement.done&&w.id<=(S.placement.startWorld||1)) return true;
  return isDone(WORLDS[w.id-2].boss);
}
function worldMissions(w){ return Object.keys(M).map(function(k){ return M[k]; }).filter(function(m){ return m.world===w.id; }); }
function worldProgress(w){ var ms=worldMissions(w); return ms.filter(function(m){ return isDone(m.id); }).length+'/'+ms.length; }
function evalProgress(w){ var ms=worldMissions(w); if(!ms.length) return Math.min(100,S.creations.length*20); return Math.round(100*ms.filter(function(m){ return isDone(m.id); }).length/ms.length); }
function findNext(){
  var start=(S.placement&&S.placement.done)?Math.max(1,Math.min(3,S.placement.startWorld||1)):1;
  for(var i=start-1;i<WORLDS.length;i++){
    var w=WORLDS[i];
    if(!worldUnlocked(w)) continue;
    var ms=worldMissions(w);
    for(var j=0;j<ms.length;j++){ if(!isDone(ms[j].id)) return ms[j]; }
  }
  return null;
}
function adaptiveTip(){
  var entries=Object.keys(S.mastery).filter(function(k){ return S.mastery[k]>0; });
  if(!entries.length) return {text:'Ayo mulai dari Hutan Logika! Kiko akan menemanimu di setiap langkah.',wid:1};
  entries.sort(function(a,b){ return S.mastery[a]-S.mastery[b]; });
  var weakest=entries[0];
  var strongest=entries[entries.length-1];
  var map={seq:1,dir:1,pattern:1,cause:1,algo:2,loop:2,debug:2,sound:2,event:3,cond:3,game:3,story:4,vars:5,app:5,ui:5,html:6,js:7,create:8};
  return {text:'Kamu sudah kuat di <b>'+CONCEPTS[strongest]+'</b>. Sekarang saatnya mengasah <b>'+CONCEPTS[weakest]+'</b>! Aku antar ke dunia yang tepat, ya.',wid:map[weakest]||1};
}

/* ============ TOAST / OVERLAY / KONFETI ============ */
var toastT=null;
function toast(msg){
  var t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent=msg;
  requestAnimationFrame(function(){ t.classList.add('show'); });
  clearTimeout(toastT);
  toastT=setTimeout(function(){ t.classList.remove('show'); },2300);
}
function showOverlay(html){
  closeOverlay();
  var o=document.createElement('div'); o.className='overlay'; o.id='ov';
  o.innerHTML='<div class="ov-card">'+html+'</div>';
  document.body.appendChild(o);
}
function closeOverlay(){ var o=document.getElementById('ov'); if(o) o.remove(); }
function speak(text){
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text); u.lang='id-ID'; u.rate=.95;
    speechSynthesis.speak(u);
  }catch(e){ toast('Suara belum tersedia di perangkat ini'); }
}
function confetti(n){
  n=n||120;
  var host=document.getElementById('fx');
  var colors=['#FF7A45','#FFC531','#3DAE5B','#12B5A5','#E85D75','#7C5CE0','#3E8DDD'];
  for(var i=0;i<n;i++){
    var b=document.createElement('div'); b.className='conf-bit';
    var shape=Math.random(), col=colors[i%colors.length], size=7+Math.random()*8;
    if(shape<.4){ b.style.cssText+='width:'+size+'px;height:'+size+'px;border-radius:50%;background:'+col; }
    else if(shape<.75){ b.style.cssText+='width:0;height:0;border-left:'+(size/1.6)+'px solid transparent;border-right:'+(size/1.6)+'px solid transparent;border-bottom:'+(size*1.5)+'px solid '+col; }
    else { b.style.cssText+='width:'+(size*1.7)+'px;height:'+(size*.7)+'px;border-radius:3px;background:'+col; }
    b.style.left=(50+(Math.random()*30-15))+'vw'; b.style.top=(30+Math.random()*20)+'vh';
    host.appendChild(b);
    var dx=(Math.random()-.5)*70, dy=60+Math.random()*50, rot=(Math.random()-.5)*720, dur=1400+Math.random()*1200;
    b.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:'translate('+dx+'vw,'+dy+'vh) rotate('+rot+'deg)',opacity:0}],{duration:dur,easing:'cubic-bezier(.2,.6,.4,1)'}).onfinish=(function(el){ return function(){ el.remove(); }; })(b);
  }
}

function drawMapPath(){
  var wrap=document.getElementById('mapwrap'), svg=document.getElementById('mapline');
  if(!wrap||!svg) return;
  var wr=wrap.getBoundingClientRect();
  svg.setAttribute('width',wr.width); svg.setAttribute('height',wr.height);
  svg.style.width=wr.width+'px'; svg.style.height=wr.height+'px';
  var orbs=wrap.querySelectorAll('.world-orb'), pts=[];
  for(var i=0;i<orbs.length;i++){
    var r=orbs[i].getBoundingClientRect();
    pts.push({x:r.left-wr.left+r.width/2, y:r.top-wr.top+r.height/2});
  }
  if(pts.length<2) return;
  var d='M '+pts[0].x+' '+pts[0].y;
  for(var j=1;j<pts.length;j++){
    var a=pts[j-1], b=pts[j];
    d+=' C '+a.x+' '+(a.y+(b.y-a.y)/2)+', '+b.x+' '+(b.y-(b.y-a.y)/2)+', '+b.x+' '+b.y;
  }
  svg.innerHTML='<path d="'+d+'" fill="none" stroke="#33283D" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round" opacity=".4"/>';
}

  var msgs={
    wall:'Hmm… Alby menabrak batu! Menurutmu, bagian mana dari program yang membuatnya menabrak?',
    pit:'Aduh, Alby jatuh ke lubang! Lubang hanya bisa dilewati dengan LOMPAT, lho.',

  };
  kikoSay(msgs[kind]||msgs.short,true); sfx.fail();
  if(CURRENT&&CURRENT.m&&CURRENT.m.id&&!CURRENT.won){
    var rec=mrec(CURRENT.m.id);
    rec.tries=(rec.tries||0)+1;
    rec.failures=(rec.failures||0)+1;
    if(rec.tries<=4){ addXP(5,true); S.retries=(S.retries||0)+1; toast('+5 XP Gigih — berani mencoba lagi!'); }
    if(CURRENT.m.concepts){
      CURRENT.m.concepts.forEach(function(c){
        if(!S.masteryEvidence[c]) S.masteryEvidence[c]={successes:0,failures:0,hints:0,variations:0,lastAt:null};
        S.masteryEvidence[c].failures=(S.masteryEvidence[c].failures||0)+1;
      });
    }
    save();
  }
}
function winMission(){
  if(!CURRENT||!CURRENT.m||CURRENT.won) return;
  if(!CURRENT.m.id){
    sfx.win(); confetti(80);
    if(CURRENT.m.studioType==='game'&&GMR){
      saveCreation('game','Game Buatan '+S.name,{speed:GMR.speed,target:GMR.target,bombs:GMR.bombs,rule:GMR.rule});
      toast('Game tersimpan di Karyamu!');
    }
    CURRENT.won=true; return;
  }
  var m=CURRENT.m, rec=mrec(m.id);
  var previousStars=rec.stars||0;
  var stars=CURRENT.hintIdx===0?3:(CURRENT.hintIdx<=2?2:1);
  var firstCompletion=!rec.done;
  rec.done=true;
  rec.stars=Math.max(previousStars,stars);
  rec.tries=rec.tries||0;
  rec.hints=Math.max(rec.hints||0,CURRENT.hintIdx||0);

  /* Mastery diberikan berdasarkan kualitas bukti, bukan sekadar menyelesaikan layar. */
  var masteryGain=firstCompletion?(stars===3?22:(stars===2?14:8)):(stars>previousStars?5:0);
  if(rec.tries===0&&CURRENT.hintIdx===0) masteryGain+=5;
  if(masteryGain>0){
    addMastery(m.concepts,masteryGain,{successes:1,hints:CURRENT.hintIdx||0,failures:rec.failures||0,variations:firstCompletion?1:0});
  }

  var fresh=checkBadges();
  save(); sfx.win(); confetti(m.boss?180:120);

  if(firstCompletion){
    addXP(m.xp+(stars===3?20:0));
  } else if(stars>previousStars){
    addXP(10,true);
    toast('Bintangmu naik! +10 XP');
  } else {
    toast('Latihan berhasil! XP utama sudah didapat sebelumnya.');
  }

  showOverlay('<h2 style="font-size:26px">'+(m.boss?'Tantangan Besar Selesai!':'Misi Selesai!')+'</h2>'
  +'<div class="big-stars">'+[1,2,3].map(function(k){ return '<svg class="ic '+(k<=stars?'f':'')+'"><use href="#i-star"/></svg>'; }).join('')+'</div>'
  +'<p style="font-weight:800;font-size:15.5px">'+m.success+'</p>'
  +'<div class="tag" style="margin-top:10px">'+ic('bulb')+' '+(m.masteryText||'Penguasaan')+': '+m.concepts.map(function(c){ return CONCEPTS[c]; }).join(' · ')+'</div>'
  +(fresh.length?'<div class="tag" style="margin-top:12px">'+ic(fresh[0].icon)+' Lencana baru: '+fresh[0].name+'!</div>':'')
  +'<div class="bubble tip" style="margin-top:14px">'+ic('spark')+' <b>Tantangan lanjutan:</b> '+m.challenge+'</div>'
  +'<div style="display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap">'
  +'<button class="btn btn-coral" onclick="A.backWorld('+m.world+')">'+ic('map')+' Kembali ke Misi</button>'
  +'<button class="btn" onclick="A.go(\'map\')">'+ic('map')+' Peta Dunia</button></div>');
  CURRENT.won=true;
}

function chipHTML(b,key){
  var d=BLOCKDEF[b.t];
  return '<span class="blk" data-key="'+key+'" style="background:'+d.bg+';color:'+d.fg+';min-height:42px;font-size:14px">'+d.label
  +(GE&&GE.debug?'':'<span class="x" data-rm="'+key+'">'+ic('x')+'</span>')+'</span>';

function renderProgram(){
  var box=document.getElementById('progbox');
  if(!box||!GE) return;
  var html='';
  for(var i=0;i<GE.program.length;i++){
    var b=GE.program[i];
    if(b.t==='loop'){
      html+='<span class="loopbox'+(GE.inside===b?' active':'')+'">'
      +'<span class="loop-head">ULANGI'
      +'<span class="stepper"><button data-ln="-1" data-li="'+i+'">−</button><b>'+b.n+'×</b><button data-ln="1" data-li="'+i+'">+</button></span>'
      +(GE.inside===b?'<button class="btn btn-sm" style="min-height:30px;padding:2px 10px;font-size:12px" data-close="1">Tutup</button>':'')
      +(GE.debug?'':'<span class="x" data-rm="'+i+'">'+ic('x')+'</span>')
      +'</span><span class="loop-kids'+(b.kids.length?'':' empty')+'">';
      for(var j=0;j<b.kids.length;j++) html+=chipHTML(b.kids[j],i+'-'+j);
      if(GE.inside===b&&!b.kids.length) html+='<i class="looptip">klik blok untuk mengisi loop…</i>';
      html+='</span></span>';
    } else html+=chipHTML(b,''+i);
  }
  box.innerHTML=html||'<i class="emptymsg">Program masih kosong — klik blok di bawah!</i>';
}
function addBlock(t){
  sfx.click();
  if(t==='loop'){ var L={t:'loop',n:2,kids:[]}; GE.program.push(L); GE.inside=L; }
  else if(GE.inside) GE.inside.kids.push({t:t});
  else GE.program.push({t:t});
  renderProgram();
}
document.addEventListener('click',function(e){
  if(!GE) return;
  var rm=e.target.closest('[data-rm]');
  if(rm){
    var k=rm.dataset.rm.split('-'); sfx.click();
    if(k.length===1) GE.program.splice(+k[0],1);
    else if(GE.program[+k[0]]) GE.program[+k[0]].kids.splice(+k[1],1);
    GE.inside=null; renderProgram(); return;
  }
  var ln=e.target.closest('[data-ln]');
  if(ln){
    var l=GE.program[+ln.dataset.li];
    if(l){ l.n=Math.max(1,Math.min(10,l.n+ +ln.dataset.ln)); sfx.click(); renderProgram(); }
    return;
  }
  if(e.target.closest('[data-close]')){ GE.inside=null; renderProgram(); return; }
  if(GE.debug){
    var chip=e.target.closest('#progbox .blk');
    if(chip) debugSwap(chip);
    return;
  }
  var pb=e.target.closest('[data-blk]');
  if(pb) addBlock(pb.dataset.blk);
});
function debugSwap(chip){
  var idx=+chip.dataset.key;
  if(GE.swap<0){ GE.swap=idx; chip.style.outline='4px solid var(--sun)'; sfx.click(); }
  else{
    var t=GE.program[GE.swap].t;
    GE.program[GE.swap].t=GE.program[idx].t; GE.program[idx].t=t;
    GE.swap=-1; sfx.pop(); renderProgram();
  }
}
function expandProg(list,out){
  for(var i=0;i<list.length;i++){
    if(out.length>300) return;
    if(list[i].t==='loop'){ for(var k=0;k<list[i].n;k++) expandProg(list[i].kids,out); }
    else out.push(list[i].t);
  }
}
function setRunBtns(run){
  var r=document.getElementById('runBtn'), s=document.getElementById('stopBtn');
  if(r) r.disabled=run;
  if(s) s.disabled=!run;
}
async function runBlocks(){
  if(!GE||GE.running) return;
  var acts=[]; expandProg(GE.program,acts);
  if(!acts.length){ kikoSay('Programnya masih kosong. Tambahkan blok dulu, ya!',true); return; }
  GE.running=true; setRunBtns(true);
  var reached=false, failed=false;
  for(var i=0;i<acts.length;i++){
    if(!GE.running) break;
    var ok=await gridStep(acts[i]);
    if(!ok){ mentorFail(failKind); failed=true; break; }
    if(GE.pos.x===GE.goal.x&&GE.pos.y===GE.goal.y){ reached=true; break; }
  }
  GE.running=false; setRunBtns(false);
  if(reached){ sfx.good(); await sleep(300); winMission(); }
  else if(!failed&&GE) mentorFail('short');
}

/* ============ ENGINE PAPAN PETAK ============ */
var TS=64;
function newGE(m,holder){
  var g=m.grid;
  GE={m:m,rows:g.rows.map(function(r){ return r.split(''); }),dir:g.facing,program:[],inside:null,
      running:false,debug:(m.type==='debug'),holder:holder,swap:-1};
  var start=null, goal=null, stars=0;
  GE.rows.forEach(function(row,y){
    row.forEach(function(ch,x){
      if(ch==='R') start={x:x,y:y};
      if(ch==='H'||ch==='C') goal={x:x,y:y};
      if(ch==='*') stars++;
    });
  });
  GE.start={x:start.x,y:start.y}; GE.pos={x:start.x,y:start.y};
  GE.goal=goal; GE.starsTotal=stars; GE.starsGot=0; GE.gateOpen=false;
}
function drawBoard(){
  var holder=GE.holder;
  if(!holder) return;
  var rows=GE.rows, cols=rows[0].length, cells='';
  rows.forEach(function(row,y){
    row.forEach(function(ch,x){
      var cx=x*TS+TS/2, cy=y*TS+TS/2, inner='';
      if(ch==='#') inner='<circle cx="'+cx+'" cy="'+cy+'" r="20" fill="#8C7F97" stroke="#33283D" stroke-width="3"/><circle cx="'+(cx-6)+'" cy="'+(cy-6)+'" r="5" fill="#B3A8BC"/>';
      else if(ch==='T') inner='<path d="M'+cx+' '+(cy-24)+' L'+(cx-17)+' '+(cy+2)+' L'+(cx+17)+' '+(cy+2)+' Z" fill="#3DAE5B" stroke="#33283D" stroke-width="3"/><rect x="'+(cx-4)+'" y="'+(cy+2)+'" width="8" height="12" rx="3" fill="#8A5A2B" stroke="#33283D" stroke-width="2.5"/>';
      else if(ch==='*') inner='<g id="star'+x+'-'+y+'"><path transform="translate('+cx+','+cy+') scale(.95)" d="M0 -13 3.6 -4.4 12.7 -3.8 5.8 2.2 7.9 11.2 0 6.4 -7.9 11.2 -5.8 2.2 -12.7 -3.8 -3.6 -4.4 Z" fill="#FFC531" stroke="#33283D" stroke-width="2.6"/></g>';
      else if(ch==='H') inner='<path d="M'+(cx-18)+' '+(cy+14)+' v-14 l18 -13 18 13 v14 h-12 v-8 h-12 v8 z" fill="#FF7A45" stroke="#33283D" stroke-width="3" stroke-linejoin="round"/>';
      else if(ch==='C') inner='<g stroke="#33283D" stroke-width="2.6"><path d="M'+(cx-13)+' '+(cy-9)+' l1.5 7 M'+(cx+13)+' '+(cy-9)+' l-1.5 7" fill="none"/><circle cx="'+cx+'" cy="'+(cy+2)+'" r="12" fill="#F2B01E"/><circle cx="'+(cx-4.5)+'" cy="'+cy+'" r="1.6" fill="#33283D" stroke="none"/><circle cx="'+(cx+4.5)+'" cy="'+cy+'" r="1.6" fill="#33283D" stroke="none"/><path d="M'+(cx-2.5)+' '+(cy+6)+' q2.5 2.4 5 0" fill="none"/></g>';
      else if(ch==='S') inner='<circle cx="'+cx+'" cy="'+cy+'" r="13" fill="#E85D75" stroke="#33283D" stroke-width="3"/><circle cx="'+cx+'" cy="'+cy+'" r="5" fill="#fff"/>';
      else if(ch==='G') inner='<g id="gate"><rect x="'+(cx-19)+'" y="'+(cy-16)+'" width="38" height="32" rx="6" fill="#8A5A2B" stroke="#33283D" stroke-width="3"/><path d="M'+(cx-12)+' '+cy+' h24 M'+cx+' '+(cy-10)+' v20" stroke="#33283D" stroke-width="4"/></g>';
      else if(ch==='O') inner='<ellipse cx="'+cx+'" cy="'+cy+'" rx="19" ry="11" fill="#4A3B52"/><ellipse cx="'+(cx-5)+'" cy="'+(cy-3)+'" rx="6" ry="3" fill="#5E4C68"/>';
      else if('v^<>'.indexOf(ch)>=0) inner='<g transform="translate('+cx+','+cy+') rotate('+({'>':0,'v':90,'<':180,'^':270}[ch])+')"><path d="M-9 -8 L6 0 L-9 8" fill="none" stroke="#E85D75" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>';
      cells+='<rect x="'+(x*TS+3)+'" y="'+(y*TS+3)+'" width="'+(TS-6)+'" height="'+(TS-6)+'" rx="12" fill="#FFF9EF" stroke="#E4D6BB" stroke-width="2.5"/>'+inner;
    });
  });
  cells+='<g id="botwrap" class="robot-wrap"><g id="botrot" class="robot-rot"><g id="bothop"><g transform="translate(-24,-26)">'+robotSVG(48)+'</g></g></g></g>';
  holder.innerHTML='<svg width="'+(cols*TS)+'" height="'+(rows.length*TS)+'" viewBox="0 0 '+(cols*TS)+' '+(rows.length*TS)+'">'+cells+'</svg>';
  var bw=document.getElementById('botwrap');
  bw.style.transition='none';
  bw.style.transform='translate('+(GE.pos.x*TS+TS/2)+'px,'+(GE.pos.y*TS+TS/2)+'px)';
  setRot();
  requestAnimationFrame(function(){ bw.style.transition=''; });
}
function setRot(){ var r=document.getElementById('botrot'); if(r) r.style.transform='rotate('+(GE.dir*90)+'deg)'; }
function moveRobot(hop){
  var w=document.getElementById('botwrap');
  if(!w) return;
  w.style.transform='translate('+(GE.pos.x*TS+TS/2)+'px,'+(GE.pos.y*TS+TS/2)+'px)';
  if(hop){
    var hp=document.getElementById('bothop');
    if(hp) hp.animate([{transform:'translateY(0)'},{transform:'translateY(-16px)'},{transform:'translateY(0)'}],{duration:380,easing:'ease'});
  }
}
function inb(x,y){ return y>=0&&y<GE.rows.length&&x>=0&&x<GE.rows[0].length; }
function landTile(t){
  if(t==='S'&&!GE.gateOpen){
    GE.gateOpen=true; sfx.pop(); toast('Klik! Tombol ditekan — gerbang terbuka!');
    var g=document.getElementById('gate');
    if(g){ var r=g.querySelector('rect'); if(r) r.setAttribute('fill','#C9E8C5'); }
  }
  if(t==='*'){
    GE.starsGot++; sfx.pop();
    var s=document.getElementById('star'+GE.pos.x+'-'+GE.pos.y);
    if(s) s.remove();
    var c=document.getElementById('starchip');
    if(c) c.innerHTML=ic('star')+' '+GE.starsGot+'/'+GE.starsTotal;
  }
  if(t==='v'){ GE.dir=1; setRot(); }
  if(t==='>'){ GE.dir=0; setRot(); }
  if(t==='<'){ GE.dir=2; setRot(); }
  if(t==='^'){ GE.dir=3; setRot(); }
}
async function gridStep(a){
  var dx=[1,0,-1,0][GE.dir], dy=[0,1,0,-1][GE.dir];
  if(a==='left'){ GE.dir=(GE.dir+3)%4; setRot(); await sleep(320); return true; }
  if(a==='right'){ GE.dir=(GE.dir+1)%4; setRot(); await sleep(320); return true; }
  if(a.slice(0,5)==='note_'){ tone(NOTES[a.slice(5)],.3,'triangle',.2); await sleep(330); return true; }
  var hop=(a==='jump');
  var nx=GE.pos.x+dx, ny=GE.pos.y+dy;
  if(!inb(nx,ny)){ failKind='out'; return false; }
  if(GE.rows[ny][nx]==='#'){ failKind='wall'; return false; }
  if(GE.rows[ny][nx]==='O'){ failKind='pit'; return false; }
  if(GE.rows[ny][nx]==='G'&&!GE.gateOpen){ failKind='gate'; return false; }
  if(hop){
    var lx=GE.pos.x+dx*2, ly=GE.pos.y+dy*2;
    if(!inb(lx,ly)){ failKind='out'; return false; }
    var land=GE.rows[ly][lx];
    if(land==='#'){ failKind='wall'; return false; }
    if(land==='O'){ failKind='pit'; return false; }
    if(land==='G'&&!GE.gateOpen){ failKind='gate'; return false; }
    GE.pos={x:lx,y:ly};
  } else {
    GE.pos={x:nx,y:ny};
  }
  landTile(GE.rows[GE.pos.y][GE.pos.x]);
  moveRobot(hop);
  await sleep(hop?420:360);
  return true;
}

      if(b.t==='loop'){ loops++; b.kids.forEach(function(k){ if(k.t.slice(0,5)==='note_') notes+=b.n; }); }
      else if(b.t.slice(0,5)==='note_') notes++;
    });
    for(var i=0;i<acts.length;i++){
      if(!GE.running) break;
      var a=acts[i];

    }

}

function startGame(cfg){
  var cv=document.getElementById('gmc');
  if(!cv) return;
  var ctx=cv.getContext('2d');
  var W=cv.width, H=cv.height;
  var speedV={lambat:2.1,sedang:3.1,cepat:4.3}[GMR.speed];
  var bombEvery=GMR.bombs==='tidak'?0:(GMR.bombs==='sedikit'?3:1.6);
  var st={score:0,t:cfg.time,px:W/2,ptx:W/2,items:[],spawn:0,over:false,raf:0,last:0};
  var ov=document.getElementById('gmOver');
  ov.classList.add('hide');
  function onMove(e){
    var r=cv.getBoundingClientRect();
    var cx=e.touches?e.touches[0].clientX:e.clientX;
    st.ptx=(cx-r.left)/r.width*W;
  }
  function onKey(e){
    if(e.key==='ArrowLeft') st.ptx=Math.max(40,st.px-46);
    if(e.key==='ArrowRight') st.ptx=Math.min(W-40,st.px+46);
  }
  cv.addEventListener('pointermove',onMove);
  cv.addEventListener('touchmove',onMove,{passive:true});
  window.addEventListener('keydown',onKey);
  var iv=null;
  function cleanup(){
    cancelAnimationFrame(st.raf);
    if(iv) clearInterval(iv);
    cv.removeEventListener('pointermove',onMove);
    cv.removeEventListener('touchmove',onMove);
    window.removeEventListener('keydown',onKey);
  }
  CURRENT.engine={dispose:cleanup};
  function updHud(){
    var hs=document.getElementById('hudS'); if(hs) hs.textContent='Skor '+st.score;
    var hl=document.getElementById('hudL'); if(hl) hl.textContent=cfg.bombs?('Aturan: '+(GMR.rule==='pause'?'waktu -2 dtk':'kembali ke tengah')):'';
    var ht=document.getElementById('hudT'); if(ht) ht.textContent='Waktu '+Math.max(0,Math.ceil(st.t))+' dtk';
  }
  function spawnItem(){
    var isBomb=bombEvery&&(st.spawn%Math.round(bombEvery+1)===Math.round(bombEvery));
    st.items.push({x:40+Math.random()*(W-80),y:-24,bomb:isBomb,vy:speedV*(0.9+Math.random()*.35)});
    st.spawn++;
  }
  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }
  function drawRobot(x,y){
    ctx.save(); ctx.translate(x,y);
    ctx.fillStyle='#FF7A45'; ctx.strokeStyle='#fff'; ctx.lineWidth=3;
    roundRect(-26,-18,52,36,12); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#33283D'; roundRect(-19,-11,38,20,8); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(-7,-2,4.5,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(8,-2,4.5,0,7); ctx.fill();
    ctx.fillStyle='#12B5A5'; roundRect(-12,18,24,8,4); ctx.fill();
    ctx.restore();
  }
  function drawStar(x,y,r){
    ctx.save(); ctx.translate(x,y); ctx.beginPath();
    for(var i=0;i<10;i++){
      var a=Math.PI/5*i-Math.PI/2, rr=i%2?r*.45:r;
      if(i) ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr); else ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr);
    }
    ctx.closePath(); ctx.fillStyle='#FFC531'; ctx.fill();
    ctx.strokeStyle='#33283D'; ctx.lineWidth=2.4; ctx.stroke(); ctx.restore();
  }
  function drawHazard(x,y){
    ctx.save(); ctx.translate(x,y);
    ctx.fillStyle='#B8A58F'; ctx.strokeStyle='#33283D'; ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(-17,7); ctx.lineTo(-13,-9); ctx.lineTo(-3,-16); ctx.lineTo(10,-11); ctx.lineTo(17,2); ctx.lineTo(8,15); ctx.lineTo(-8,17); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle='#E6D4BA'; ctx.beginPath(); ctx.arc(-5,-5,4,0,7); ctx.fill();
    ctx.restore();
  }
  function endGame(won,msg){
    st.over=true; cleanup();
    ov.classList.remove('hide');
    if(won){
      ov.innerHTML='<h2 style="font-family:Baloo 2;font-size:30px">SASARAN TERCAPAI!</h2>'
      +'<p style="font-weight:700">Game buatanmu berhasil dimenangkan!</p>'
      +'<button class="btn btn-sun" id="gmDone">Lanjutkan Misi</button>';
      document.getElementById('gmDone').onclick=function(){ ov.classList.add('hide'); winMission(); };
    } else {
      ov.innerHTML='<h2 style="font-family:Baloo 2;font-size:26px">'+(msg||'Belum berhasil')+'</h2>'
      +'<p style="font-weight:700">Pembuat game hebat selalu menyetel ulang aturannya. Coba lagi!</p>'
      +'<div style="display:flex;gap:10px;margin-top:8px">'
      +'<button class="btn btn-sun" id="gmRetry">'+ic('redo')+' Coba Lagi</button>'
      +'<button class="btn" id="gmSetel">Setel Aturan</button></div>';
      document.getElementById('gmRetry').onclick=function(){ ov.classList.add('hide'); startGame(cfg); };
      document.getElementById('gmSetel').onclick=function(){ ov.classList.add('hide'); };
      mentorFail('short');
    }
  }
  function loop(ts){
    if(st.over) return;
    var dt=Math.min(40,ts-(st.last||ts)); st.last=ts;
    st.t-=dt/1000;
    st.px+=(st.ptx-st.px)*.16;
    if(st.t<=0){ endGame(false,'Waktu habis!'); return; }
    st.items.forEach(function(it){ it.y+=it.vy*dt/16.7; });
    st.items=st.items.filter(function(it){
      var near=Math.abs(it.x-st.px)<34&&Math.abs(it.y-(H-38))<34;
      if(near&&!it.bomb){ st.score++; sfx.pop(); updHud(); return false; }
      if(near&&it.bomb){
        sfx.fail();
        if(GMR.rule==='pause'){ st.t=Math.max(0,st.t-2); }
        else { st.ptx=W/2; st.px=W/2; }
        updHud();
        return false;
      }
      return it.y<H+30;
    });
    ctx.fillStyle='#10333B'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(255,255,255,.5)';
    for(var i=0;i<26;i++){ ctx.fillRect((i*97)%W,(i*53)%(H-80),2,2); }
    ctx.fillStyle='#1E5A50'; ctx.fillRect(0,H-22,W,22);
    st.items.forEach(function(it){ if(it.bomb) drawHazard(it.x,it.y); else drawStar(it.x,it.y,15); });
    drawRobot(st.px,H-38);
    if(st.score>=GMR.target){ endGame(true); return; }
    st.raf=requestAnimationFrame(loop);
  }
  iv=setInterval(spawnItem,720);
  updHud();
  st.raf=requestAnimationFrame(loop);
}

function playStory(startIdx,onDone){
  var endingsSeen={};
  function countSeen(){ var n=0; for(var k in endingsSeen) n++; return n; }
  function showEnding(end,label){
    showOverlay('<div style="text-align:left"><div class="story-view">'+sceneSVG(end.bg)
    +'<div class="dialog"><b style="color:var(--rose)">ENDING ('+esc(label)+'):</b> '+(esc(end.text)||'…')+'</div>'
    +'<div class="story-choices">'
    +(countSeen()<2?'<button class="btn btn-sun" id="againS">'+ic('redo')+' Pilih Jalur Lain</button>':'')
    +'<button class="btn btn-leaf" id="finS">'+ic('check')+' Selesai</button></div></div></div>');
    var ag=document.getElementById('againS');
    if(ag) ag.onclick=function(){ sfx.click(); render(2); };
    document.getElementById('finS').onclick=function(){ sfx.win(); closeOverlay(); onDone(); };
  }
  function render(i){
    var s=STORY.scenes[i], isLast=(i===2), foot='';
    if(isLast&&STORY.branch){
      foot='<div class="story-choices">'
      +'<button class="btn btn-teal" id="pickA">'+ic('aright')+' '+esc(STORY.choiceA)+'</button>'
      +'<button class="btn btn-coral" id="pickB">'+ic('aright')+' '+esc(STORY.choiceB)+'</button></div>';
    } else {
      foot='<div class="story-choices"><button class="btn btn-sun" id="nextS">'+(i===2?'Selesai':ic('aright')+' Lanjut')+'</button></div>';
    }
    showOverlay('<div style="text-align:left"><div class="story-view">'+sceneSVG(s.bg)
    +'<div class="dialog"><b style="color:var(--coral)">ALBY:</b> '+esc(s.text)+'</div>'+foot+'</div>'
    +'<div style="display:flex;gap:8px;margin-top:12px;align-items:center"><span class="chip">Adegan '+(i+1)+'/3</span>'
    +'<button class="btn btn-sm" style="margin-left:auto" onclick="speak(this.closest(\'.ov-card\').querySelector(\'.dialog\').textContent)">'+ic('vol')+' Bacakan</button></div></div>');
    var nx=document.getElementById('nextS');
    if(nx) nx.onclick=function(){
      if(i===2){ sfx.win(); closeOverlay(); onDone(); }
      else { sfx.click(); render(i+1); }
    };
    var pa=document.getElementById('pickA'), pb=document.getElementById('pickB');
    if(pa) pa.onclick=function(){ sfx.good(); endingsSeen.A=1; showEnding(STORY.endA,STORY.choiceA); };
    if(pb) pb.onclick=function(){ sfx.good(); endingsSeen.B=1; showEnding(STORY.endB,STORY.choiceB); };
  }
  render(startIdx);
}

function webDoc(w){
  var acts=w.elems.filter(function(e){ return e.t==='btn'; });
  var body='';
  w.elems.forEach(function(e){
    if(e.t==='h1') body+='  <!-- Judul besar halaman -->\n  <h1>'+esc(e.text)+'</h1>\n\n';
    if(e.t==='p') body+='  <!-- Paragraf teks -->\n  <p>'+esc(e.text)+'</p>\n\n';
    if(e.t==='img') body+='  <!-- Stiker -->\n  <div class="stiker"></div>\n\n';
    if(e.t==='btn') body+='  <!-- Tombol: saat diklik, lakukan '+e.act+' -->\n  <button onclick="'+(e.act==='sapa'?'sapa()':e.act==='warna'?'gantiWarna()':'hitung()')+'">'+esc(e.text)+'</button>\n\n';
  });
  var script='';
  if(acts.length){
    var js='';
    if(acts.some(function(a){ return a.act==='hitung'; })) js+='  let klik = 0; // variabel untuk menyimpan angka\n';
    if(acts.some(function(a){ return a.act==='warna'; })) js+='  let warna = 0; // variabel posisi warna\n';
    if(acts.some(function(a){ return a.act==='sapa'; })) js+='  function sapa() {\n    document.getElementById("pesan").textContent = "Halo! Terima kasih sudah mengunjungi halamanku!";\n  }\n';
    if(acts.some(function(a){ return a.act==='warna'; })) js+='  function gantiWarna() {\n    warna = warna + 1;\n    const daftar = ["#FFF6E0", "#E4F4E0", "#E0EEFA", "#FDE8EE"];\n    document.body.style.background = daftar[warna % 4];\n  }\n';
    if(acts.some(function(a){ return a.act==='hitung'; })) js+='  function hitung() {\n    klik = klik + 1; // ambil isi kotak, tambah 1, simpan kembali\n    document.getElementById("angka").textContent = klik;\n  }\n';
    script='<script>\n'+js+'<\/script>';
  }
  var ps='';
  if(acts.some(function(a){ return a.act==='sapa'; })) ps+='  <p id="pesan"></p>\n\n';
  if(acts.some(function(a){ return a.act==='hitung'; })) ps+='  <p>Jumlah klik: <b id="angka">0</b></p>\n\n';
  return '<!DOCTYPE html>\n<html>\n<head>\n  <style>\n'
  +'    body { font-family: sans-serif; text-align: center; background: '+w.bg+'; padding: 30px; }\n'
  +'    h1 { color: #FF7A45; }\n'
  +'    .stiker { width: 70px; height: 70px; margin: 12px auto;\n      background: #FFC531; border: 3px solid #33283D; border-radius: 50%;\n      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }\n'
  +'    button { font-size: 17px; padding: 10px 18px; margin: 6px; border-radius: 12px;\n      border: 3px solid #33283D; background: #12B5A5; color: white; font-weight: bold; cursor: pointer; }\n'
  +'  </style>\n</head>\n<body>\n'+body+ps+script+'</body>\n</html>';
}

    var btn=this; btn.disabled=true;
    GE.running=true; GE.pos={x:GE.start.x,y:GE.start.y}; GE.dir=0;
    moveRobot(false); await sleep(200);
    var acts=[];
    var i1;
    for(i1=0;i1<+document.getElementById('s1').value;i1++) acts.push('fwd');
    var s2=document.getElementById('s2').value;
    acts.push(s2==='putarKanan()'?'right':(s2==='putarKiri()'?'left':'fwd'));
    var i3;

      if(GE.pos.x===GE.goal.x&&GE.pos.y===GE.goal.y){ reached=true; break; }

    if(reached){ sfx.good(); await sleep(300); winMission(); }

}

/* ============ SIMPAN KARYA ============ */
function saveCreation(type,name,data){
  var editId=CURRENT?(CURRENT.editId||CURRENT.createdId):null;
  if(editId){
    S.creations.forEach(function(c){ if(c.id===editId){ c.name=name; c.data=data; c.date=new Date().toISOString(); } });
  } else {
    var id=uid();
    S.creations.push({id:id,type:type,name:name,date:new Date().toISOString(),data:data});
    if(CURRENT) CURRENT.createdId=id;
    addMastery(STUDIO_CONCEPTS[type]||['create'],20);
    addXP(60); /* menciptakan bernilai lebih tinggi daripada menonton */
    checkBadges();
  }
  save();
}

/* ---- studio kuis ---- */
function initQuizEngine(existing){
  var stage=document.getElementById('stage');
  var qs=existing?JSON.parse(JSON.stringify(existing.data.qs)):[{q:'',o:['','',''],a:0},{q:'',o:['','',''],a:0},{q:'',o:['','',''],a:0}];
  stage.innerHTML=''
  +'<div class="stage-head"><h3>Bengkel Kuis</h3><span class="chip">3 pertanyaan pilihan ganda</span></div>'
  +qs.map(function(q,i){
    return '<div class="rule-card" style="margin-bottom:12px"><h4>'+ic('bulb')+' Pertanyaan '+(i+1)+'</h4>'
    +'<div class="field"><input type="text" data-qq="'+i+'" maxlength="80" placeholder="Tulis pertanyaanmu…" value="'+esc(q.q)+'"></div>'
    +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">'
    +q.o.map(function(o,j){
      return '<div style="display:flex;flex-direction:column;gap:4px">'
      +'<input type="text" data-qo="'+i+'-'+j+'" maxlength="40" placeholder="Pilihan '+(j+1)+'" value="'+esc(o)+'" style="border:3px solid '+(q.a===j?'var(--leaf)':'var(--ink)')+';border-radius:12px;padding:8px 10px;font-weight:700">'
      +'<label style="font-weight:800;font-size:12px;display:flex;gap:5px;align-items:center"><input type="radio" name="qa'+i+'" data-qa="'+i+'-'+j+'" '+(q.a===j?'checked':'')+'> jawaban benar</label></div>';
    }).join('')+'</div></div>';
  }).join('')
  +'<div class="runbar"><button class="btn btn-coral" id="qGo" style="flex:1">'+ic('play')+' Mainkan Kuis</button>'
  +'<button class="btn btn-sun" id="qSave">'+ic('box')+' Simpan Karya</button></div>';
  function sync(){
    var qq=stage.querySelectorAll('[data-qq]');
    for(var i=0;i<qq.length;i++) qs[+qq[i].dataset.qq].q=qq[i].value;
    var qo=stage.querySelectorAll('[data-qo]');
    for(var j=0;j<qo.length;j++){ var p=qo[j].dataset.qo.split('-'); qs[+p[0]].o[+p[1]]=qo[j].value; }
    var qa=stage.querySelectorAll('[data-qa]');
    for(var k=0;k<qa.length;k++){
      if(qa[k].checked){
        var pp=qa[k].dataset.qa.split('-');
        qs[+pp[0]].a=+pp[1];
        var card=qa[k].closest('.rule-card');
        var opts=card.querySelectorAll('[data-qo]');
        for(var m=0;m<opts.length;m++){
          var jj=+opts[m].dataset.qo.split('-')[1];
          opts[m].style.borderColor=(jj===qs[+pp[0]].a)?'var(--leaf)':'var(--ink)';
        }
      }
    }
  }
  stage.addEventListener('input',sync);
  stage.addEventListener('change',sync);
  function play(i,score){
    var q=qs[i];
    showOverlay('<div style="text-align:left"><span class="chip">Soal '+(i+1)+'/3 · Skor '+score+'</span>'
    +'<h3 style="font-size:20px;margin:12px 0">'+(esc(q.q)||'…')+'</h3>'
    +'<div style="display:flex;flex-direction:column;gap:10px">'
    +q.o.map(function(o,j){ return '<button class="btn" data-pick="'+j+'" style="justify-content:flex-start">'+(esc(o)||'—')+'</button>'; }).join('')
    +'</div></div>');
    var btns=document.querySelectorAll('#ov [data-pick]');
    for(var b=0;b<btns.length;b++){
      (function(btn){
        btn.onclick=function(){
          var j=+btn.dataset.pick;
          if(j===q.a){ score++; sfx.good(); btn.style.background='var(--leaf)'; btn.style.color='#fff'; }
          else { sfx.fail(); btn.style.background='var(--rose)'; btn.style.color='#fff'; }
          setTimeout(function(){
            if(i<2) play(i+1,score);
            else {
              sfx.win(); confetti(80);
              showOverlay('<h2 style="font-size:24px">Kuis selesai!</h2><p style="font-weight:800;margin:10px 0">Skor: '+score+'/3 '+(score===3?'— sempurna!':'')+'</p>'
              +'<button class="btn btn-coral" onclick="A.closeOverlay()">'+ic('check')+' Asyik!</button>');
              kikoSay(score===3?'Kuis-mu berfungsi sempurna!':'Kuis-mu jalan! Kalau ada jawaban yang janggal, tinggal edit dan simpan lagi.',true);
            }
          },700);
        };
      })(btns[b]);
    }
  }
  document.getElementById('qGo').onclick=function(){
    sync();
    var bad=qs.some(function(q){ return !q.q.trim()||q.o.some(function(o){ return !o.trim(); }); });
    if(bad){ kikoSay('Lengkapi dulu semua pertanyaan dan pilihannya, ya!',true); return; }
    play(0,0);
  };
  document.getElementById('qSave').onclick=function(){
    sync();
    saveCreation('quiz','Kuis Buatan '+S.name,{qs:qs});
    toast('Kuis tersimpan di Karyamu!');
  };
}

  +'<button class="blk" data-a="jump" style="background:#3DAE5B;color:#fff">LONCAT</button>'
  +'<button class="blk" data-a="spin" style="background:#3E8DDD;color:#fff">PUTAR</button>'
  +'<button class="blk" data-a="wig" style="background:#E85D75;color:#fff">GOYANG</button>'
  +'<button class="blk" data-a="star" style="background:#FFC531">BINTANG</button>'
  +'<button class="blk" data-a="ndo" style="background:#FF7A45;color:#fff">NADA DO</button>'
  +'<button class="blk" data-a="nmi" style="background:#FF7A45;color:#fff">NADA MI</button>'
  +'<button class="blk" data-a="nsol" style="background:#FF7A45;color:#fff">NADA SOL</button></div></div>'
  +'<div class="runbar"><button class="btn btn-leaf" id="anRun" style="flex:1">'+ic('play')+' Jalankan Animasi</button>'
  +'<button class="btn btn-sm" id="anClear">'+ic('trash')+' Kosongkan</button>'
  +'<button class="btn btn-sun" id="anSave">'+ic('box')+' Simpan Karya</button></div>';
  function render(){
    document.getElementById('anProg').innerHTML=prog.length?prog.map(function(a,i){
      return '<span class="blk" style="min-height:40px;background:#fff;font-size:13px">'+lbl[a]+'<span class="x" data-x="'+i+'">'+ic('x')+'</span></span>';
    }).join(' '):'<i class="emptymsg">Susun gerakannya di sini!</i>';
  }
  render();
  stage.addEventListener('click',function(e){
    var a=e.target.closest('[data-a]');
    if(a&&prog.length<14){ prog.push(a.dataset.a); sfx.click(); render(); return; }
    var x=e.target.closest('[data-x]');
    if(x){ prog.splice(+x.dataset.x,1); sfx.click(); render(); }
  });
  document.getElementById('anClear').onclick=function(){ prog=[]; render(); };
  document.getElementById('anRun').onclick=async function(){
    if(!prog.length){ kikoSay('Panggungnya masih kosong! Tambahkan aksi dulu.',true); return; }
    var ch=document.getElementById('anChar');
    for(var i=0;i<prog.length;i++){
      var a=prog[i];
      if(a==='jump'){ ch.animate([{transform:'translateY(0)'},{transform:'translateY(-34px)'},{transform:'translateY(0)'}],{duration:420,easing:'ease'}); await sleep(440); }
      else if(a==='spin'){ ch.animate([{transform:'rotate(0)'},{transform:'rotate(360deg)'}],{duration:520,easing:'ease-in-out'}); await sleep(540); }
      else if(a==='wig'){ ch.animate([{transform:'rotate(-12deg)'},{transform:'rotate(12deg)'},{transform:'rotate(0)'}],{duration:420}); await sleep(440); }
      else if(a==='star'){ confetti(24); sfx.pop(); await sleep(340); }
      else if(a==='ndo'||a==='nmi'||a==='nsol'){
        tone(NOTES[a.slice(1)],.32,'triangle',.22);
        ch.animate([{transform:'translateY(0)'},{transform:'translateY(-12px)'},{transform:'translateY(0)'}],{duration:300});
        await sleep(340);
      }
    }
    kikoSay('Animasimu tayang! Coba susun ulang urutannya — urutan mengubah segalanya.',true);
  };
  document.getElementById('anSave').onclick=function(){
    if(!prog.length){ toast('Tambahkan aksi dulu sebelum menyimpan'); return; }
    saveCreation('anim','Animasi '+S.name,{prog:prog});
    toast('Animasi tersimpan di Karyamu!');
  };
}

/* ============ BOOT ============ */
function boot(){
  try{
    muted=!S.sound;
    if(S.seen){
      if(!S.placement||!S.placement.done){ startPlacement(); }
      else { if(S.placement.reader===false) document.body.classList.add('pre-reader'); SCREENS.home(); }
    } else SCREENS.splash();
  }catch(err){
    showFatal(err.message);
  }
}
window.addEventListener('resize',function(){ if(document.getElementById('mapline')) drawMapPath(); });
boot();
